<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>議事録ツール</title>
<style>
  body {
    font-family: sans-serif;
    background: #1a1a1a;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 30px;
  }
  #recordBtn {
    padding: 16px 32px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #d1a355;
    color: #1a1a1a;
    cursor: pointer;
  }
  #transcript {
    margin-top: 30px;
    width: 100%;
    max-width: 500px;
    min-height: 150px;
    background: #262626;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

  <h1>議事録・タスク抽出ツール</h1>

  <button id="recordBtn">録音開始</button>

  <div id="transcript">ここに文字起こしが表示されます</div>

</body>
</html>
