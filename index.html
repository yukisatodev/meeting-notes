<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI議事録・タスク抽出ツール</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #0c1826;
    --ink-line: #29496b;
    --ink-line-soft: #16283c;
    --blue: #6fa3cf;
    --gold: #d1a355;
    --gold-dim: #8a6f3f;
    --text-light: #eae5d6;
    --text-dim: #86a0ba;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans JP', sans-serif;
    --serif: 'Zen Old Mincho', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--text-light);
    font-family: var(--sans);
    line-height: 1.75;
    min-height: 100vh;
    background-image:
      linear-gradient(var(--ink-line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--ink-line-soft) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--blue);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before { content: ''; width: 22px; height: 1px; background: var(--blue); }

  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(24px, 4.4vw, 32px);
    margin: 16px 0 40px;
    color: var(--text-light);
  }

  .panel {
    border: 1px solid var(--ink-line);
    background: rgba(234, 230, 218, 0.02);
    padding: 24px;
    margin-bottom: 20px;
  }

  .panel-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  button {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 13px 26px;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  button:hover { background: var(--gold); color: var(--ink); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:disabled:hover { background: transparent; color: var(--gold); }

  #recordBtn.recording {
    background: var(--gold);
    color: var(--ink);
  }

  #transcript {
    margin-top: 18px;
    min-height: 110px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--ink-line);
    padding: 14px;
    white-space: pre-wrap;
    font-size: 14px;
    color: var(--text-dim);
  }

  #result {
    margin-top: 18px;
    font-size: 14px;
  }
  #result h3 {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 16px 0 8px;
  }
  #result h3:first-child { margin-top: 0; }
  #result p { color: var(--text-dim); }
  #result ul { padding-left: 18px; color: var(--text-dim); }
  #result li { margin-bottom: 4px; }

  #history {
    margin-top: 18px;
  }
  .history-item {
    border: 1px solid var(--ink-line);
    padding: 16px;
    margin-bottom: 12px;
  }
  .history-item .date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--blue);
    margin-bottom: 8px;
  }
  .history-item .summary {
    font-size: 14px;
    color: var(--text-light);
    margin-bottom: 8px;
  }
  .history-item ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .back-link {
    display: inline-block;
    margin-top: 48px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-line);
    padding-bottom: 2px;
  }
  .back-link:hover { color: var(--gold); border-color: var(--gold-dim); }
</style>
</head>
<body>

<div class="wrap">

  <div class="eyebrow">In Progress / Portfolio</div>
  <h1>AI議事録・タスク抽出ツール</h1>

  <div class="panel">
    <div class="panel-label">01 — Recording</div>
    <button id="recordBtn">録音開始</button>
    <div id="transcript">ここに文字起こしが表示されます</div>
  </div>

  <div class="panel">
    <div class="panel-label">02 — Summary</div>
    <button id="summarizeBtn">要約・タスク抽出</button>
    <div id="result"></div>
  </div>

  <div class="panel">
    <div class="panel-label">03 — History</div>
    <button id="loadHistoryBtn">過去の議事録を見る</button>
    <div id="history"></div>
  </div>

  <a class="back-link" href="https://yukisatodev.github.io/">← Yuki Sato</a>

</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const transcriptDiv = document.getElementById('transcript');
    const summarizeBtn = document.getElementById('summarizeBtn');
    const resultDiv = document.getElementById('result');
    const loadHistoryBtn = document.getElementById('loadHistoryBtn');
    const historyDiv = document.getElementById('history');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      transcriptDiv.textContent = 'このブラウザは音声認識に対応していません。Google Chromeでお試しください。';
      recordBtn.disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      let isRecording = false;
      let finalTranscript = '';

      recordBtn.addEventListener('click', () => {
        if (!isRecording) {
          finalTranscript = transcriptDiv.textContent === 'ここに文字起こしが表示されます' ? '' : transcriptDiv.textContent;
          recognition.start();
          recordBtn.textContent = '停止';
          recordBtn.classList.add('recording');
          isRecording = true;
        } else {
          recognition.stop();
          recordBtn.textContent = '録音開始';
          recordBtn.classList.remove('recording');
          isRecording = false;
        }
      });

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + '\n';
          } else {
            interimTranscript += transcript;
          }
        }
        transcriptDiv.textContent = finalTranscript + interimTranscript;
      };

      recognition.onerror = (event) => {
        console.error('音声認識エラー:', event.error);
      };
    }

    summarizeBtn.addEventListener('click', async () => {
      const transcript = transcriptDiv.textContent;
      resultDiv.textContent = '要約中...(少し時間がかかります)';

      try {
        const res = await fetch('http://localhost:3000/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transcript })
        });
        const data = await res.json();
        const parsed = JSON.parse(data.raw);

        resultDiv.innerHTML = `
          <h3>要約</h3>
          <p>${parsed.summary}</p>
          <h3>タスク</h3>
          <ul>${parsed.todos.map(t => `<li>${t}</li>`).join('')}</ul>
        `;
      } catch (err) {
        resultDiv.textContent = 'エラーが発生しました: ' + err.message;
      }
    });

    loadHistoryBtn.addEventListener('click', async () => {
      historyDiv.textContent = '読み込み中...';

      try {
        const res = await fetch('http://localhost:3000/meetings');
        const meetings = await res.json();

        if (meetings.length === 0) {
          historyDiv.textContent = 'まだ議事録が保存されていません。';
          return;
        }

        historyDiv.innerHTML = meetings.map(m => `
          <div class="history-item">
            <div class="date">${m.created_at}</div>
            <div class="summary">${m.summary}</div>
            <ul>${m.todos.map(t => `<li>${t}</li>`).join('')}</ul>
          </div>
        `).join('');
      } catch (err) {
        historyDiv.textContent = 'エラーが発生しました: ' + err.message;
      }
    });
  </script>
</body>
</html>
