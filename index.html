<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>議事録ツール</title>
<style>
  body {
    font-family: sans-serif;
    background: #1a1a1a;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 30px;
  }
  #recordBtn, #summarizeBtn, #loadHistoryBtn {
    padding: 16px 32px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #d1a355;
    color: #1a1a1a;
    cursor: pointer;
  }
  #summarizeBtn, #loadHistoryBtn {
    margin-top: 20px;
  }
  #transcript {
    margin-top: 30px;
    width: 100%;
    max-width: 500px;
    min-height: 150px;
    background: #262626;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    white-space: pre-wrap;
  }
  #result {
    margin-top: 20px;
    width: 100%;
    max-width: 500px;
    white-space: pre-wrap;
  }
  #result h3 {
    margin-top: 16px;
    margin-bottom: 8px;
    color: #d1a355;
  }
  #history {
    margin-top: 20px;
    width: 100%;
    max-width: 500px;
  }
  .history-item {
    background: #262626;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .history-item .date {
    font-size: 12px;
    color: #999;
    margin-bottom: 8px;
  }
  .history-item .summary {
    margin-bottom: 8px;
  }
  .history-item ul {
    margin: 0;
    padding-left: 20px;
  }
</style>
</head>
<body>

  <h1>議事録・タスク抽出ツール</h1>

  <button id="recordBtn">録音開始</button>

  <div id="transcript">ここに文字起こしが表示されます</div>

  <button id="summarizeBtn">要約・タスク抽出</button>

  <div id="result"></div>

  <button id="loadHistoryBtn">過去の議事録を見る</button>

  <div id="history"></div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const transcriptDiv = document.getElementById('transcript');
    const summarizeBtn = document.getElementById('summarizeBtn');
    const resultDiv = document.getElementById('result');
    const loadHistoryBtn = document.getElementById('loadHistoryBtn');
    const historyDiv = document.getElementById('history');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      transcriptDiv.textContent = 'このブラウザは音声認識に対応していません。Google Chromeでお試しください。';
      recordBtn.disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      let isRecording = false;
      let finalTranscript = '';

      recordBtn.addEventListener('click', () => {
        if (!isRecording) {
          finalTranscript = transcriptDiv.textContent === 'ここに文字起こしが表示されます' ? '' : transcriptDiv.textContent;
          recognition.start();
          recordBtn.textContent = '停止';
          isRecording = true;
        } else {
          recognition.stop();
          recordBtn.textContent = '録音開始';
          isRecording = false;
        }
      });

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + '\n';
          } else {
            interimTranscript += transcript;
          }
        }
        transcriptDiv.textContent = finalTranscript + interimTranscript;
      };

      recognition.onerror = (event) => {
        console.error('音声認識エラー:', event.error);
      };
    }

    summarizeBtn.addEventListener('click', async () => {
      const transcript = transcriptDiv.textContent;
      resultDiv.textContent = '要約中...(少し時間がかかります)';

      try {
        const res = await fetch('http://localhost:3000/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transcript })
        });
        const data = await res.json();
        const parsed = JSON.parse(data.raw);

        resultDiv.innerHTML = `
          <h3>要約</h3>
          <p>${parsed.summary}</p>
          <h3>タスク</h3>
          <ul>${parsed.todos.map(t => `<li>${t}</li>`).join('')}</ul>
        `;
      } catch (err) {
        resultDiv.textContent = 'エラーが発生しました: ' + err.message;
      }
    });

    loadHistoryBtn.addEventListener('click', async () => {
      historyDiv.textContent = '読み込み中...';

      try {
        const res = await fetch('http://localhost:3000/meetings');
        const meetings = await res.json();

        if (meetings.length === 0) {
          historyDiv.textContent = 'まだ議事録が保存されていません。';
          return;
        }

        historyDiv.innerHTML = meetings.map(m => `
          <div class="history-item">
            <div class="date">${m.created_at}</div>
            <div class="summary">${m.summary}</div>
            <ul>${m.todos.map(t => `<li>${t}</li>`).join('')}</ul>
          </div>
        `).join('');
      } catch (err) {
        historyDiv.textContent = 'エラーが発生しました: ' + err.message;
      }
    });
  </script>
</body>
</html>
