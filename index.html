<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>議事録ツール</title>
<style>
  body {
    font-family: sans-serif;
    background: #1a1a1a;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 30px;
  }
  #recordBtn {
    padding: 16px 32px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #d1a355;
    color: #1a1a1a;
    cursor: pointer;
  }
  #transcript {
    margin-top: 30px;
    width: 100%;
    max-width: 500px;
    min-height: 150px;
    background: #262626;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 16px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

  <h1>議事録・タスク抽出ツール</h1>

  <button id="recordBtn">録音開始</button>

  <div id="transcript">ここに文字起こしが表示されます</div>
<script>
    const recordBtn = document.getElementById('recordBtn');
    const transcriptDiv = document.getElementById('transcript');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      transcriptDiv.textContent = 'このブラウザは音声認識に対応していません。Google Chromeでお試しください。';
      recordBtn.disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      let isRecording = false;
      let finalTranscript = '';

      recordBtn.addEventListener('click', () => {
        if (!isRecording) {
          finalTranscript = transcriptDiv.textContent === 'ここに文字起こしが表示されます' ? '' : transcriptDiv.textContent;
          recognition.start();
          recordBtn.textContent = '停止';
          isRecording = true;
        } else {
          recognition.stop();
          recordBtn.textContent = '録音開始';
          isRecording = false;
        }
      });

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + '\n';
          } else {
            interimTranscript += transcript;
          }
        }
        transcriptDiv.textContent = finalTranscript + interimTranscript;
      };

      recognition.onerror = (event) => {
        console.error('音声認識エラー:', event.error);
      };
    }
  </script>
</body>
</html>
